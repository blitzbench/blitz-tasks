[package]
name = "blitz-task"
version = "0.1.0"
edition = "2021"
license-file = "../../LICENSE"
description = "Rust framework for BlitzBench benchmark tasks - Task trait, callbacks, TASK.json parsing."
publish = false

# Keep this package standalone even when the repo is vendored inside another
# Cargo workspace (e.g. blitz-server pulls blitz-tasks in as a submodule).
[workspace]

[lib]
name = "blitz_task"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
